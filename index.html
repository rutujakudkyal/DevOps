<!DOCTYPE html>
<html>

<head>
    <title>Login and Registration</title>
    <style>
        body {
            font-family: Arial;
            background: lightblue;
            text-align: center;
            padding: 50px;
        }

        .box {
            background: white;
            width: 300px;
            margin: auto;
            padding: 20px;
            border-radius: 10px;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 10px;
        }

        button {
            padding: 10px 30px;
            background: blue;
            color: white;
            border: none;
        }
    </style>
</head>

<body>

    <div class="box">
        <h2>Login</h2>
        <input type="email" placeholder="Enter Email">
        <input type="password" placeholder="Enter Password">
        <button>Login</button>

        <hr>

        <h2>Registration</h2>
        <input type="text" placeholder="Enter Name">
        <input type="email" placeholder="Enter Email">
        <input type="password" placeholder="Enter Password">
        <button>Register</button>
    </div>

</body>

</html>
